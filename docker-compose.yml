version: '3.7'

services:

  asr:
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    command: gunicorn server:app -b :8000 --workers 1 --threads=1 --worker-class=gthread --timeout 3600
    restart: unless-stopped
    ports:
      - 5051:8000
    volumes:
      - .:/app
      - ./models:/app/models
    container_name: asrapi
    environment:
      - ASR_API_CONFIG=/app/config.json
      - MODELS_ROOT=/app/models
      - USE_CUDA==0  # CPU: 0 | GPU: 1
      - HF_HOME=/app/models/.hf_cache
      - MAX_AUDIO_MB=500
    
    # CPU MODE (default):
    # Keep USE_CUDA=0 and leave the entire block below commented out.
    #
    # NVIDIA GPU MODE:
    # Requires a compatible NVIDIA GPU and Docker GPU support.
    # 1. Change USE_CUDA=0 above to USE_CUDA=1.
    # 2. Uncomment ALL lines of the deploy block below.   
